# Build BulletSim binaries from the latest Bullet and BulletSim glue sources

name: BulletSim build binaries

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BuildDate: ''

concurrency:
  group: bulletsim-build-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix: 
        # os: [ ubuntu-latest, macos-latest, windows-latest ]
        include:
          - os: ubuntu-22.04
            osclass: ubuntu
            name: "BulletSim binary build for Ubuntu"
            build_type: Release
            ext: so
            scriptext: sh
          - os: macos-latest
            osclass: macos
            name: "BulletSim binary build for MacOS"
            build_type: Release
            ext: dylib
            scriptext: sh
          - os: windows-latest
            osclass: win
            name: "BulletSim binary build for Windows"
            build_type: Release
            ext: dll
            scriptext: bat

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - name: git checkout
        uses: actions/checkout@v5
        with:
          ref: master
          path: bulletsim

      - name: clone Bullet with retries
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bulletsim/bullet3
          for attempt in 1 2 3 ; do
            echo "=== clone attempt ${attempt}/3"
            if git clone --depth 1 --single-branch --branch master --filter=blob:none --no-checkout https://github.com/bulletphysics/bullet3.git bulletsim/bullet3 ; then
              cd bulletsim/bullet3
              git config core.longpaths true || true
              if git checkout --progress --force master ; then
                cd ../../
                break
              fi
              cd ../../
            fi
            rm -rf bulletsim/bullet3
            if [[ "$attempt" -eq 3 ]]; then
              echo "ERROR: failed to clone/checkout bullet3 after 3 attempts"
              exit 1
            fi
            sleep 10
          done

      - name: apply patches to Bullet
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd bulletsim/bullet3
          target_file="src/BulletDynamics/Dynamics/btDiscreteDynamicsWorld.cpp"
          marker_text="when sleeping, force the motion state to be called/updated"
          patch_files=(../00*.patch)
          if [[ ${#patch_files[@]} -eq 0 ]]; then
            echo "ERROR: no patch files matched ../00*.patch"
            exit 1
          fi

          for file in "${patch_files[@]}" ; do
            echo "====== $file"

            if git apply --check "$file"; then
              git apply "$file"
              continue
            fi

            if git apply --3way "$file"; then
              continue
            fi

            patch_name="$(basename "$file")"
            if [[ "$patch_name" == "0001-Call-setWorldTransform-when-object-is-going-inactive.patch" ]]; then
              echo "Patch did not apply cleanly; attempting manual fallback for $patch_name"
              if [[ ! -f "$target_file" ]]; then
                echo "ERROR: target file not found: $target_file"
                exit 1
              fi

              if ! grep -Fq "$marker_text" "$target_file"; then
                tmp_file="${target_file}.tmp"
                if awk '
                  BEGIN { inserted = 0 }
                  {
                    print
                    if (!inserted && $0 ~ /body->setLinearVelocity\(btVector3\(0,[[:space:]]*0,[[:space:]]*0\)\);/) {
                      match($0, /^[[:space:]]*/)
                      ind = substr($0, RSTART, RLENGTH)
                      print ind "// when sleeping, force the motion state to be called/updated"
                      print ind "if (body->getMotionState())"
                      print ind "    body->getMotionState()->setWorldTransform(body->getWorldTransform());"
                      inserted = 1
                    }
                  }
                  END {
                    if (!inserted) {
                      exit 2
                    }
                  }
                ' "$target_file" > "$tmp_file"; then
                  mv "$tmp_file" "$target_file"
                else
                  rm -f "$tmp_file"
                  echo "ERROR: manual fallback could not locate insertion point in $target_file"
                  exit 1
                fi
              fi

              if grep -Fq "$marker_text" "$target_file"; then
                echo "Manual fallback applied for $patch_name"
                continue
              fi
            fi

            if grep -Fq "$marker_text" "$target_file"; then
              echo "Patch content already present in $target_file; continuing."
              continue
            fi

            echo "ERROR: patch failed and marker not found: $file"
            exit 1
          done

      - name: set env vars based on sources
        shell: bash
        run: |
          echo "BuildDate=$(date +%Y%m%d)" >> $GITHUB_ENV
          cd bulletsim
          echo "BulletSimVersion=$(cat VERSION)" >> $GITHUB_ENV
          echo "BulletSimGitVersion=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "BulletSimGitVersionShort=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          cd bullet3
          echo "BulletVersion=$(cat VERSION)" >> $GITHUB_ENV
          echo "BulletGitVersion=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "BulletGitVersionShort=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: create BulletSimVersionInfo file
        shell: bash
        run: |
          cd bulletsim
          echo "BuildDate=$BuildDate" > BulletSimVersionInfo
          echo "BulletSimVersion=$BulletSimVersion" >> BulletSimVersionInfo
          echo "BulletSimGitVersion=$BulletSimGitVersion" >> BulletSimVersionInfo
          echo "BulletSimGitVersionShort=$BulletSimGitVersionShort" >> BulletSimVersionInfo
          echo "BulletVersion=$BulletVersion" >> BulletSimVersionInfo
          echo "BulletGitVersion=$BulletGitVersion" >> BulletSimVersionInfo
          echo "BulletGitVersionShort=$BulletGitVersionShort" >> BulletSimVersionInfo

      # Ensure CMake is available for Windows build without relying on an external setup action
      - name: ensure CMake on Windows
        if: matrix.osclass == 'win'
        shell: pwsh
        run: |
          if (Get-Command cmake -ErrorAction SilentlyContinue) {
            cmake --version
            exit 0
          }
          choco install cmake --yes --installargs 'ADD_CMAKE_TO_PATH=System'
          cmake --version

      # Dotnet is required on all platforms (buildBulletCMake.sh checks dotnet version)
      - name: Setup Dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: build Bullet physics engine
        run: |
          cd bulletsim
          ./buildBulletCMake.${{ matrix.scriptext }}

      - name: build BulletSim
        run: |
          cd bulletsim
          ./buildBulletSim.${{ matrix.scriptext }}

      # Dotnet build puts binaries in sub-dirs so move them to a standard place
      - name: move dotnet built files into 'built' directory
        if: matrix.osclass == 'win'
        shell: bash
        run: |
          mkdir -p built
          cp bulletsim/BulletSimVersionInfo built/
          cp bulletsim/x64/${{ matrix.build_type }}/BulletSim.dll built/
          cp bulletsim/x64/${{ matrix.build_type }}/BulletSim.lib built/
          cp bulletsim/x64/${{ matrix.build_type }}/BulletSim.pdb built/

      # Other targets just build the binaries
      - name: move non-dotnet built files into 'built' directory
        if: matrix.osclass != 'win'
        shell: bash
        run: |
          mkdir -p built
          cp bulletsim/BulletSimVersionInfo built/
          cp bulletsim/libBulletSim-*.${{ matrix.ext }} built/


      - name: Upload built files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BulletSim-${{ matrix.osclass }}-${{ env.BuildDate }}
          path: built/*
          if-no-files-found: error

